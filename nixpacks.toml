[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "nodejs_20",
  "php84Extensions.pdo",
  "php84Extensions.pdo_mysql",
  "php84Extensions.mbstring",
  "php84Extensions.tokenizer",
  "php84Extensions.xml",
  "php84Extensions.ctype",
  "php84Extensions.bcmath",
  "php84Extensions.curl",
  "php84Extensions.fileinfo",
  "php84Extensions.dom"
]

[phases.install]
cmds = [
  "php -v",
  "composer --version",
  "composer install --no-dev --optimize-autoloader --no-scripts --no-interaction",
  "npm ci",
  "npm run build"
]

[phases.build]
cmds = [
  "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/framework/testing storage/logs bootstrap/cache",
  "chmod -R 777 storage bootstrap/cache",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"