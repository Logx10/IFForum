[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.ctype", "php84Extensions.bcmath", "php84Extensions.openssl", "php84Extensions.curl", "php84Extensions.fileinfo", "php84Extensions.dom", "php84Extensions.session", "nodejs_20"]
cmds = [
  "curl -sS https://getcomposer.org/installer | php84 -- --install-dir=/usr/local/bin --filename=composer"
]

[phases.install]
cmds = [
  "php -v",
  "which php",
  "composer --version",
  "composer install --no-dev --optimize-autoloader --no-scripts --no-interaction"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-scripts --no-interaction",
  "npm ci",
  "npm run build"
]

[phases.build]
cmds = [
  "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache",
  "chmod -R 777 storage bootstrap/cache",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"